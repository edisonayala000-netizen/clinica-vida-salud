# Configuración de Apache para la imagen Docker (ver Dockerfile).
ServerName localhost
ServerTokens Prod
ServerSignature Off

# Permite el .htaccess de la raíz (reescritura de direcciones y carpetas protegidas).
<Directory /var/www/html>
    AllowOverride All
    Require all granted

    # Railway atiende https y reenvía la petición por http: así PHP sabe que la conexión es segura
    # (cookies de sesión con Secure y enlaces de los correos con https). Va dentro de <Directory>
    # para que se aplique también después de la reescritura a backend/public/index.php.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
</Directory>

# IP real del visitante para la bitácora y el límite de intentos. El proxy de Railway la envía en
# X-Real-IP y es el único que llega al contenedor, por eso se acepta de cualquier origen.
RemoteIPHeader X-Real-IP
RemoteIPInternalProxy 0.0.0.0/0 ::/0
